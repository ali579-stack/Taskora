<script>
async function loadAvailableTasks() {
  const grid = document.getElementById("availableTaskGrid");
  const message = document.getElementById("tasksMessage");

  try {
    const response = await taskoraApi("/tasks/available", {
      method: "GET"
    });

    const tasks = Array.isArray(response?.tasks)
      ? response.tasks
      : [];

    if (!tasks.length) {
      message.textContent = "No tasks are available right now.";
      return;
    }

    message.style.display = "none";

    grid.innerHTML = tasks.map(task => {
      const reward = Number(task.reward_per_worker || 0).toFixed(2);
      const remaining =
        Math.max(
          0,
          Number(task.worker_limit || 0) -
          Number(task.completed_workers || 0)
        );

      return `
        <article class="available-task-card">

          <div class="available-task-top">
            <span class="task-type">
              ${escapeHtml(task.type || "Task")}
            </span>

            <span class="task-reward">
              $${reward}
            </span>
          </div>

          <h3>${escapeHtml(task.title || "Untitled Task")}</h3>

          <p>
            ${escapeHtml(
              task.description || "Complete this task and submit proof."
            )}
          </p>

          <div class="task-meta-row">
            <span><i data-lucide="users"></i> ${remaining} left</span>
            <span><i data-lucide="globe"></i> ${escapeHtml(task.language || "en")}</span>
          </div>

          <a
            class="btn btn-primary btn-full"
            href="task.html?id=${encodeURIComponent(task.id)}"
          >
            Start Task
          </a>

        </article>
      `;
    }).join("");

  } catch (error) {
    console.error("Available tasks error:", error);

    if (
      error?.message ===
      "Link at least one social account before accessing available tasks."
    ) {
      message.innerHTML =
        '<i data-lucide="link"></i> Link at least one social account to unlock tasks. ' +
        '<a href="profile.html" style="color:#4f46e5;font-weight:700;">Link an account →</a>';
      return;
    }

    message.textContent =
      error.message || "Unable to load available tasks.";
  }
}

function escapeHtml(value) {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

loadAvailableTasks();
</script>

<script>
"use strict";


/* =====================================================
   CONSTANTS
====================================================== */

const TASKORA_MAX_LINKED_ACCOUNTS = 14;


/* =====================================================
   TASK START
====================================================== */

function startTask(taskName) {

  TaskoraPopup.alert(
    "Starting task: " +
    taskName +
    "\n\n" +
    "The task workflow will be connected to the backend."
  );

}


/* =====================================================
   SOCIAL ACCOUNTS
====================================================== */

async function addSocialAccount(platform) {

  const accountName = prompt(
    "Enter your " +
    platform +
    " username or account name:"
  );


  if (!accountName) {
    return;
  }


  const cleanName =
    accountName.trim();


  if (!cleanName) {
    return;
  }


  try {

    const response = await fetch(
      `${TASKORA_API_URL}/social-accounts`,
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        credentials: "include",

        body: JSON.stringify({
          platform: platform,
          accountName: cleanName
        })
      }
    );


    const data =
      await response.json();


    if (!response.ok) {

      TaskoraPopup.alert(
        data.message ||
        "Unable to link this account."
      );

      return;

    }


    TaskoraPopup.alert(
      "Account linked successfully.\n\n" +
      "Status: Pending verification"
    );


    await loadLinkedAccounts();

  } catch (error) {

    console.error(
      "Link account error:",
      error
    );


    TaskoraPopup.alert(
      "Unable to connect to TASKORA server."
    );

  }

}


async function loadLinkedAccounts() {

  try {

    const response = await fetch(
      `${TASKORA_API_URL}/social-accounts`,
      {
        method: "GET",
        credentials: "include"
      }
    );


    if (!response.ok) {
      return;
    }


    const data =
      await response.json();


    const accounts =
      Array.isArray(data.accounts)
        ? data.accounts
        : [];


    const countElement =
      document.getElementById(
        "linkedAccountsCount"
      );


    if (countElement) {

      countElement.textContent =
        `${accounts.length} / ${TASKORA_MAX_LINKED_ACCOUNTS}`;

    }


    renderLinkedAccounts(accounts);

  } catch (error) {

    console.error(
      "Load linked accounts error:",
      error
    );

  }

}


function renderLinkedAccounts(accounts) {

  const list =
    document.getElementById(
      "linkedAccountsList"
    );

  if (!list) {
    return;
  }

  /*
   * These are the existing platform limits.
   * The backend remains the final authority/enforcer.
   */
  const platforms = [
    {
      key: "instagram",
      name: "Instagram",
      limit: 3
    },
    {
      key: "tiktok",
      name: "TikTok",
      limit: 3
    },
    {
      key: "youtube",
      name: "YouTube",
      limit: 2
    },
    {
      key: "facebook",
      name: "Facebook",
      limit: 2
    },
    {
      key: "x",
      name: "X",
      limit: 2
    },
    {
      key: "other",
      name: "Other",
      limit: 2
    }
  ];

  const grouped = {};

  platforms.forEach(function (platform) {
    grouped[platform.key] = [];
  });

  accounts.forEach(function (account) {

    const platform =
      String(account.platform || "").toLowerCase();

    if (grouped[platform]) {
      grouped[platform].push(account);
    }

  });

  list.innerHTML = "";

  platforms.forEach(function (platform) {

    const platformAccounts =
      grouped[platform.key] || [];

    const count =
      platformAccounts.length;

    const group =
      document.createElement("div");

    group.className =
      "linked-account-group";

    group.innerHTML = `
      <div class="linked-account-group-header">

        <div>

          <span class="task-category">
            ${escapeHtml(platform.name)}
          </span>

          <h3>
            ${escapeHtml(platform.name)}
          </h3>

        </div>

        <strong>
          ${count} / ${platform.limit}
        </strong>

      </div>

      <button
        type="button"
        class="btn btn-primary"
        onclick="addSocialAccount('${platform.key}')"
        ${count >= platform.limit ? "disabled" : ""}
      >
        ${count >= platform.limit ? "Limit Reached" : "+ Add " + escapeHtml(platform.name)}
      </button>

      <div class="linked-account-slots">
        ${Array.from(
          { length: platform.limit },
          function (_, index) {

            const account =
              platformAccounts[index];

            if (!account) {

              return `
                <div class="linked-account-slot linked-account-slot-empty">

                  <span>
                    Empty slot
                  </span>

                </div>
              `;

            }

            return `
              <div class="linked-account-slot linked-account-slot-filled">

                <div class="linked-account-slot-info">

                  <strong>
                    ${escapeHtml(
                      account.account_name || "Unnamed account"
                    )}
                  </strong>

                  <span class="status status-pending">
                    ${escapeHtml(
                      account.verification_status || "Pending"
                    )}
                  </span>

                </div>

                <button
                  type="button"
                  class="btn btn-outline"
                  onclick="removeSocialAccount(${Number(account.id)})"
                >
                  Remove
                </button>

              </div>
            `;

          }
        ).join("")}
      </div>
    `;

    list.appendChild(group);

  });

}


async function removeSocialAccount(accountId) {

  const confirmed =
    await TaskoraPopup.confirm(
      "Remove this linked account?"
    );


  if (!confirmed) {
    return;
  }


  try {

    const response = await fetch(
      `${TASKORA_API_URL}/social-accounts/${accountId}`,
      {
        method: "DELETE",
        credentials: "include"
      }
    );


    const data =
      await response.json();


    if (!response.ok) {

      TaskoraPopup.alert(
        data.message ||
        "Unable to remove account."
      );

      return;

    }


    await loadLinkedAccounts();

  } catch (error) {

    console.error(
      "Remove account error:",
      error
    );


    TaskoraPopup.alert(
      "Unable to connect to TASKORA server."
    );

  }

}


function escapeHtml(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


/* =====================================================
   SIDEBAR
====================================================== */

const sidebar =
  document.getElementById("sidebar");


const menuButton =
  document.getElementById("menuButton");


const sidebarClose =
  document.getElementById("sidebarClose");


const sidebarOverlay =
  document.getElementById("sidebarOverlay");


function openSidebar() {

  if (sidebar) {

    sidebar.classList.add("open");

  }


  if (sidebarOverlay) {

    sidebarOverlay.classList.add("active");

  }

}


function closeSidebar() {

  if (sidebar) {

    sidebar.classList.remove("open");

  }


  if (sidebarOverlay) {

    sidebarOverlay.classList.remove("active");

  }

}


if (menuButton) {

  menuButton.addEventListener(
    "click",
    openSidebar
  );

}


if (sidebarClose) {

  sidebarClose.addEventListener(
    "click",
    closeSidebar
  );

}


if (sidebarOverlay) {

  sidebarOverlay.addEventListener(
    "click",
    closeSidebar
  );

}


document
  .querySelectorAll(
    ".sidebar-nav .nav-item"
  )
  .forEach(
    function (item) {

      item.addEventListener(
        "click",
        closeSidebar
      );

    }
  );


/* =====================================================
   SECTION NAVIGATION
====================================================== */

(function initSectionNavigation() {

  const sections =
    Array.from(
      document.querySelectorAll(
        ".dashboard-section"
      )
    );

  const navItems =
    Array.from(
      document.querySelectorAll(
        ".sidebar-nav .nav-item[href^='#']"
      )
    );

  function activateSection(hash) {

    let target =
      (hash || "").replace("#", "");

    if (!target) {
      target = "dashboard";
    }

    const section =
      document.getElementById(target);

    /*
     * If a navbar target does not exist, fall back
     * to the dashboard instead of leaving the page blank.
     */
    if (!section) {
      target = "dashboard";
    }

    sections.forEach(function (item) {

      item.style.display =
        item.id === target
          ? ""
          : "none";

    });

    navItems.forEach(function (item) {

      const itemHash =
        item.getAttribute("href");

      item.classList.toggle(
        "active",
        itemHash === "#" + target
      );

    });

    const activeSection =
      document.getElementById(target);

    if (activeSection) {

      activeSection.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });

    }
  }

  navItems.forEach(function (item) {

    item.addEventListener(
      "click",
      function () {

        const hash =
          item.getAttribute("href");

        if (hash) {
          activateSection(hash);
        }

      }
    );

  });

  window.addEventListener(
    "hashchange",
    function () {
      activateSection(
        window.location.hash
      );
    }
  );

  activateSection(
    window.location.hash
  );

})();

/* =====================================================
   LANGUAGE
====================================================== */

const languageSelect =
  document.getElementById(
    "languageSelect"
  );


if (languageSelect) {

  const savedLanguage =
    localStorage.getItem(
      "taskora_language"
    );


  if (savedLanguage) {

    languageSelect.value =
      savedLanguage;

  }


  languageSelect.addEventListener(
    "change",
    function () {

      localStorage.setItem(
        "taskora_language",
        this.value
      );

    }
  );

}


/* =====================================================
   SEARCH
====================================================== */

const taskSearch =
  document.getElementById(
    "taskSearch"
  );


if (taskSearch) {

  taskSearch.addEventListener(
    "input",
    function () {

      const query =
        this.value
          .trim()
          .toLowerCase();


      document
        .querySelectorAll(
          "#tasks .task-card"
        )
        .forEach(
          function (card) {

            const text =
              card.textContent
                .toLowerCase();


            card.style.display =
              !query ||
              text.includes(query)
                ? ""
                : "none";

          }
        );

    }
  );

}


/* =====================================================
   LOAD LINKED ACCOUNTS
====================================================== */

loadLinkedAccounts();

<script>
(() => {
  const toggle = document.getElementById("themeToggle");
  if (!toggle || toggle.dataset.scrollHideReady) return;

  toggle.dataset.scrollHideReady = "1";

  let ticking = false;

  function updateThemeButton() {
    if (window.scrollY > 20) {
      toggle.classList.add("theme-toggle-hidden");
    } else {
      toggle.classList.remove("theme-toggle-hidden");
    }
    ticking = false;
  }

  window.addEventListener("scroll", () => {
    if (!ticking) {
      requestAnimationFrame(updateThemeButton);
      ticking = true;
    }
  }, { passive: true });

  updateThemeButton();
})();
</script>
