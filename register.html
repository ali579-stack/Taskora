<!DOCTYPE html>
<html lang="en">
<head>
<script src="assets/js/theme.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — TASKORA</title>
  <link rel="stylesheet" href="assets/css/style.css">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="assets/js/icons.js"></script>
</head>
<body class="auth-page">

<button
  class="theme-toggle"
  id="themeToggle"
  type="button"
  aria-label="Toggle theme"
  title="Toggle theme"
>
  <i data-lucide="moon"></i>
</button>



<div class="auth-container">

  <a class="logo auth-logo" href="index.html">
    TASK<span>ORA</span>
  </a>

  <div class="auth-card">
    <h1>Create your account</h1>
    <p class="auth-subtitle">Join TASKORA today.</p>

    <form id="registerForm">

      <label for="name">Full name</label>
      <input id="name" type="text" required>

      <label for="email">Email</label>
      <input id="email" type="email" required>

      <label for="role">Account type</label>
      <select id="role" required>
        <option value="worker">Worker — Earn rewards</option>
        <option value="trusted">Trusted User — Create tasks</option>
      </select>

      <label for="password">Password</label>
      <div class="password-field">
        <input id="password" type="password" minlength="8" required>
        <button
          type="button"
          class="password-toggle"
          data-password-toggle="password"
          aria-label="Show password"
          aria-pressed="false"
        ><i data-lucide="eye"></i></button>
      </div>

      <label class="checkbox-label">
        <input type="checkbox" required>
        I agree to the Terms and Privacy Policy.
      </label>

      <button class="btn btn-primary btn-full" type="submit">
        Create Account
      </button>

    </form>

    <p class="auth-footer">
      Already have an account?
      <a href="login.html">Sign in</a>
    </p>
  </div>

</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/password-toggle.js"></script>
</body>
</html>
